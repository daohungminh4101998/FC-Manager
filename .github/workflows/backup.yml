name: Supabase Auto Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Ensure pg_dump 17 is used (fix PATH priority)
        run: |
          # Ubuntu runner đã có sẵn pg_dump 16 trong /usr/bin.
          # update-alternatives đôi khi không tự trỏ sang bản mới trong CI,
          # nên ta ép PATH ưu tiên thư mục chứa bản 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check pg_dump version
        run: pg_dump --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            -f "backups/backup-$(date +'%Y-%m-%d_%H-%M').sql"

      - name: Commit and push backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit \
            -m "Auto backup $(date +'%Y-%m-%d %H:%M')" \
            || echo "No changes"
          git push
