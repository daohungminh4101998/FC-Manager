name: Supabase Auto Backup

on:
  schedule:
    - cron: '0 2 * * *'  # chạy mỗi ngày lúc 2h sáng UTC
  workflow_dispatch:       # cho phép chạy tay từ tab Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --clean --if-exists \
            -f backups/backup-$(date +'%Y-%m-%d_%H-%M').sql

      - name: Commit and push backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "Auto backup $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
